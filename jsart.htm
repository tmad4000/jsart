<head>
<title>JSArt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js"></script>


    <script>
        $(function () {
            var NUM_SQUARES = 4500

            _.times(NUM_SQUARES, (n) =>
                $("#app").append($("<span class='square' style='background-color: hsl(120, " + n / NUM_SQUARES * 100 + "%, 50%); \
                position: relative; \
                top:"+ Math.random()*10 + "; \
                left:"+ Math.random()*10 + "; \
                '></span>"))
            )

            // $("#app").mousemove( (e) => {
                
                
            // })

        })
    </script>
    <style>
        #app {
            width: 1200px
        }

        .square {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 5px;
        }

        body {
            background: black
        }
    </style>
<link rel="stylesheet" href="release.css">
<script defer src="app-stamp.js"></script>
</head>

<body>
    <div id="app"></div>


<footer class="app-release"><span id="wit-feedback-mount"></span><span data-app-stamp data-show="time" data-src="version.json"></span></footer>
<script defer src="https://worldissuetracker.com/widget/wit-feedback.js" data-tracker-slug="jsart-feedback" data-app="JSArt" data-mode="feedback" data-trigger="tab" data-label="Send feedback" data-mount-selector="#wit-feedback-mount"></script>
</body>
